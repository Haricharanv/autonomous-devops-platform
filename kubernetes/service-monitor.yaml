apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: devops-demo-app
  namespace: devops-platform
  labels:
    app: devops-demo-app
    release: prometheus
    app.kubernetes.io/name: devops-demo-app
    app.kubernetes.io/part-of: devops-platform
spec:
  selector:
    matchLabels:
      app: devops-demo-app
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scheme: http
