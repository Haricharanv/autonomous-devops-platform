name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  pull-requests: write
  issues: write

env:
  PYTHON_VERSION: '3.11'
  IMAGE_NAME: autonomous-devops-platform
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  # ==========================================
  # a) Test Job
  # ==========================================
  test:
    name: Run Tests & Code Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'app/requirements.txt'

      - name: Install dependencies from app/requirements.txt
        run: |
          python -m pip install --upgrade pip
          if [ -f app/requirements.txt ]; then
            pip install -r app/requirements.txt
          fi
          pip install pytest pytest-cov

      - name: Run pytest with coverage
        run: |
          pytest --cov=app --cov-report=xml

      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14

  # ==========================================
  # b) Build Job
  # ==========================================
  build:
    name: Build & Security Scan
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: "Build Docker image with tags: latest + git SHA"
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ hashFiles('Dockerfile') != '' && 'Dockerfile' || (hashFiles('docker/Dockerfile') != '' && 'docker/Dockerfile' || 'Dockerfile') }}
          load: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scan on the built image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: 'table'
          output: 'trivy-results.txt'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-scan-results
          path: trivy-results.txt
          retention-days: 14

      - name: Push image to Docker Hub (only on main branch)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  # ==========================================
  # c) Deploy Job
  # ==========================================
  deploy:
    name: Deploy to Kubernetes
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Set up kubectl and configure
        env:
          KUBECONFIG_SECRET: ${{ secrets.KUBECONFIG }}
        run: |
          mkdir -p $HOME/.kube
          if [ -n "$KUBECONFIG_SECRET" ]; then
            echo "$KUBECONFIG_SECRET" | base64 -d > $HOME/.kube/config 2>/dev/null || echo "$KUBECONFIG_SECRET" > $HOME/.kube/config
            chmod 600 $HOME/.kube/config
          else
            echo "KUBECONFIG secret not found. Using default environment configuration."
          fi
          kubectl version --client=true

      - name: Apply Kubernetes manifests from kubernetes/ directory
        run: |
          if [ -d "kubernetes" ] && [ -n "$(ls -A kubernetes 2>/dev/null)" ]; then
            kubectl apply -f kubernetes/
          else
            echo "kubernetes/ directory is empty or does not exist. Skipping apply."
          fi

      - name: Verify deployment rollout status
        run: |
          if [ -d "kubernetes" ] && [ -n "$(ls -A kubernetes 2>/dev/null)" ]; then
            echo "Verifying deployment rollout status..."
            DEPLOYMENTS=$(kubectl get deployments -o jsonpath='{.items[*].metadata.name}' 2>/dev/null || true)
            if [ -n "$DEPLOYMENTS" ]; then
              for dep in $DEPLOYMENTS; do
                echo "Waiting for rollout of deployment: $dep"
                kubectl rollout status deployment/"$dep" --timeout=180s
              done
            else
              echo "No deployments found in cluster to verify."
            fi
          else
            echo "No Kubernetes manifests found. Skipping rollout verification."
          fi

      - name: Add deployment status comment if PR
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            let prNumber = context.payload.pull_request?.number;
            if (!prNumber) {
              try {
                const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  commit_sha: context.sha,
                });
                if (prs && prs.length > 0) {
                  prNumber = prs[0].number;
                }
              } catch (error) {
                console.log('Could not find associated pull request:', error.message);
              }
            }

            if (prNumber) {
              const status = '${{ job.status }}' === 'success' ? '✅ Succeeded' : '❌ Failed';
              const body = `### 🚀 Deployment Rollout Status: ${status}\n\n` +
                `- **Commit**: \`${context.sha}\`\n` +
                `- **Branch**: \`${context.ref}\`\n` +
                `- **Triggered By**: @${context.actor}\n` +
                `- **Workflow Run**: [View Details](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})\n\n` +
                `*Automated Kubernetes deployment status reported by CI/CD pipeline.*`;

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: body,
              });
              console.log(`Successfully added deployment status comment to PR #${prNumber}`);
            } else {
              console.log('No pull request found for this deployment. Skipping comment.');
            }
