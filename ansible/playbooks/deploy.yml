---
- name: Deploy Application to Kubernetes Cluster
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    kubeconfig_path: "{{ kubeconfig_path | default('~/.kube/config') }}"
    app_namespace: "{{ app_namespace | default('devops-platform') }}"
    app_name: "{{ app_name | default('devops-demo-app') }}"
    k8s_manifests_dir: "{{ k8s_manifests_dir | default('/home/haricharanv/PBL_DEVOPS/kubernetes') }}"
    rollout_timeout: "180s"

  tasks:
    - name: Check if kubectl executable is available
      ansible.builtin.command:
        cmd: which kubectl
      register: kubectl_check
      changed_when: false
      failed_when: kubectl_check.rc != 0

    - name: Check if Minikube executable is available
      ansible.builtin.command:
        cmd: which minikube
      register: minikube_check
      changed_when: false
      failed_when: minikube_check.rc != 0

    - name: Verify Kubernetes cluster connectivity
      ansible.builtin.command:
        cmd: "kubectl cluster-info --kubeconfig={{ kubeconfig_path }}"
      register: cluster_connectivity
      changed_when: false
      failed_when: cluster_connectivity.rc != 0

    - name: Check if application namespace exists
      ansible.builtin.command:
        cmd: "kubectl get namespace {{ app_namespace }} --kubeconfig={{ kubeconfig_path }}"
      register: namespace_check
      changed_when: false
      failed_when: false

    - name: Create namespace if it does not exist
      ansible.builtin.command:
        cmd: "kubectl create namespace {{ app_namespace }} --kubeconfig={{ kubeconfig_path }}"
      when: namespace_check.rc != 0
      register: namespace_create
      changed_when: namespace_create.rc == 0

    - name: Apply ConfigMap manifest
      ansible.builtin.command:
        cmd: "kubectl apply -f {{ k8s_manifests_dir }}/configmap.yaml -n {{ app_namespace }} --kubeconfig={{ kubeconfig_path }}"
      register: apply_configmap
      changed_when: "'configured' in apply_configmap.stdout or 'created' in apply_configmap.stdout"

    - name: Apply Deployment manifest
      ansible.builtin.command:
        cmd: "kubectl apply -f {{ k8s_manifests_dir }}/deployment.yaml -n {{ app_namespace }} --kubeconfig={{ kubeconfig_path }}"
      register: apply_deployment
      changed_when: "'configured' in apply_deployment.stdout or 'created' in apply_deployment.stdout"

    - name: Apply Service manifest
      ansible.builtin.command:
        cmd: "kubectl apply -f {{ k8s_manifests_dir }}/service.yaml -n {{ app_namespace }} --kubeconfig={{ kubeconfig_path }}"
      register: apply_service
      changed_when: "'configured' in apply_service.stdout or 'created' in apply_service.stdout"

    - name: Check if HPA manifest exists
      ansible.builtin.stat:
        path: "{{ k8s_manifests_dir }}/hpa.yaml"
      register: hpa_manifest_stat

    - name: Apply HPA manifest
      ansible.builtin.command:
        cmd: "kubectl apply -f {{ k8s_manifests_dir }}/hpa.yaml -n {{ app_namespace }} --kubeconfig={{ kubeconfig_path }}"
      when: hpa_manifest_stat.stat.exists
      register: apply_hpa
      changed_when: "'configured' in apply_hpa.stdout or 'created' in apply_hpa.stdout"

    - name: Wait for deployment rollout to complete
      ansible.builtin.command:
        cmd: "kubectl rollout status deployment/{{ app_name }} -n {{ app_namespace }} --timeout={{ rollout_timeout }} --kubeconfig={{ kubeconfig_path }}"
      register: rollout_status
      changed_when: false

    - name: Verify pods are running
      ansible.builtin.command:
        cmd: "kubectl get pods -n {{ app_namespace }} -l app={{ app_name }} -o jsonpath='{.items[*].status.phase}' --kubeconfig={{ kubeconfig_path }}"
      register: pod_phases
      changed_when: false
      failed_when: "'Running' not in pod_phases.stdout"

    - name: Retrieve deployment status details
      ansible.builtin.command:
        cmd: "kubectl get deployment {{ app_name }} -n {{ app_namespace }} -o wide --kubeconfig={{ kubeconfig_path }}"
      register: deployment_info
      changed_when: false

    - name: Retrieve pod status details
      ansible.builtin.command:
        cmd: "kubectl get pods -n {{ app_namespace }} -l app={{ app_name }} -o wide --kubeconfig={{ kubeconfig_path }}"
      register: pods_info
      changed_when: false

    - name: Retrieve Minikube service URL
      ansible.builtin.command:
        cmd: "minikube service {{ app_name }} -n {{ app_namespace }} --url"
      register: minikube_url
      changed_when: false
      failed_when: false

    - name: Discover fallback service NodePort URL
      ansible.builtin.shell:
        cmd: >
          NODE_IP=$(minikube ip 2>/dev/null || kubectl get nodes -o jsonpath='{.items[0].status.addresses[?(@.type=="InternalIP")].address}' --kubeconfig={{ kubeconfig_path }} 2>/dev/null || echo "127.0.0.1");
          NODE_PORT=$(kubectl get svc {{ app_name }} -n {{ app_namespace }} -o jsonpath='{.spec.ports[0].nodePort}' --kubeconfig={{ kubeconfig_path }} 2>/dev/null || echo "80");
          echo "http://${NODE_IP}:${NODE_PORT}"
      register: fallback_url
      when: minikube_url.rc != 0 or minikube_url.stdout == ""
      changed_when: false

    - name: Determine resolved service URL
      ansible.builtin.set_fact:
        service_url: "{{ minikube_url.stdout if (minikube_url.rc == 0 and minikube_url.stdout != '') else fallback_url.stdout }}"

    - name: Print deployment status and service URL
      ansible.builtin.debug:
        msg:
          - "========================================================"
          - "             DEPLOYMENT SUCCESSFUL                      "
          - "========================================================"
          - "Application:      {{ app_name }}"
          - "Namespace:        {{ app_namespace }}"
          - "Service URL:      {{ service_url }}"
          - "Rollout Status:   {{ rollout_status.stdout }}"
          - "--------------------------------------------------------"
          - "Deployment Information:"
          - "{{ deployment_info.stdout_lines }}"
          - "--------------------------------------------------------"
          - "Pod Information:"
          - "{{ pods_info.stdout_lines }}"
          - "========================================================"
